name: Publish private bootstrap image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nist-grounded-v9-bootstrap:v1
      - name: Verify published trust anchor and create attestation
        run: |
          image="ghcr.io/${{ github.repository_owner }}/nist-grounded-v9-bootstrap@${{ steps.build.outputs.digest }}"
          public_key_sha256="$(docker run --rm --entrypoint /bin/sh "$image" -c 'sha256sum /trust/v9-grounded.pub' | cut -d' ' -f1)"
          bootstrap_sha256="$(docker run --rm --entrypoint /bin/sh "$image" -c 'sha256sum /usr/local/bin/v9-bootstrap' | cut -d' ' -f1)"
          docker run --rm --entrypoint /bin/sh "$image" -c 'test -x /usr/local/bin/cosign; test -x /usr/local/bin/uv'
          printf '{"schema_version":"v9-bootstrap-attestation-v1","image":"%s","public_key_sha256":"%s","bootstrap_sha256":"%s","source_commit":"%s"}\n' "$image" "$public_key_sha256" "$bootstrap_sha256" "$GITHUB_SHA" > bootstrap-attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-attestation
          path: bootstrap-attestation.json
          if-no-files-found: error
