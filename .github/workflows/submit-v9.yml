name: Submit signed V9 base-probe panel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-paid-base-probe-panel
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    name: Submit exact signed V9 panel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: v9-paid-submission
    steps:
      - uses: actions/checkout@eef6144bb98fc1a7e6c85973b76431bc572318ea
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the pinned Hub client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.24.0'
      - name: Verify and submit the exactly signed panel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python submit_signed_v9_panel.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: v9-signed-submission-receipts
          path: submission-receipts/*.json
          if-no-files-found: error
