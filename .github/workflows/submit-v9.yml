name: Submit signed V9 base-probe panel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-paid-base-probe-panel
  cancel-in-progress: false

jobs:
  qwen25_32b_instruct:
    uses: ./.github/workflows/_submit-signed-v9-probe.yml
    with:
      probe: qwen25_32b_instruct
    secrets: inherit
  qwen25_coder_32b:
    uses: ./.github/workflows/_submit-signed-v9-probe.yml
    with:
      probe: qwen25_coder_32b
    secrets: inherit
  gpt_oss_20b:
    uses: ./.github/workflows/_submit-signed-v9-probe.yml
    with:
      probe: gpt_oss_20b
    secrets: inherit
